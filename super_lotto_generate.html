<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>威力彩號碼產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-300">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 導航 -->
        <div class="flex items-center gap-4 mb-8">
            <a href="index.html" class="nav-link text-sm">← 首頁</a>
            <span class="text-slate-600">|</span>
            <a href="super_lotto_check.html" class="nav-link text-sm">對獎程式</a>
        </div>

        <!-- 標題 -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-white mb-1">🎲 威力彩號碼產生器</h1>
            <p class="text-slate-400 text-sm">選擇策略、設定偏好號碼，產生投注號碼</p>
        </div>

        <!-- 設定區 -->
        <div class="card">
            <h2 class="text-lg font-bold text-white mb-4">策略設定</h2>

            <!-- 策略選擇 -->
            <div class="mb-4">
                <label for="strategy">選擇策略</label>
                <select id="strategy" onchange="onStrategyChange()">
                    <option value="56注全包">56注全包（5,600元）</option>
                    <option value="28注(必中九獎)" selected>28注 必中九獎（2,800元）</option>
                    <option value="21注(7組碰)">21注 7組碰（2,100元）</option>
                    <option value="8注(第二區全包)">8注 第二區全包（800元）</option>
                    <option value="8注(第一區展開)">8注 第一區展開（800元）</option>
                </select>
            </div>

            <!-- 動態參數區 -->
            <div id="params-favorite" class="mb-4">
                <label for="favorite">喜歡的號碼 <span class="text-slate-500">（用於 56注、28注、8注一區，逗號或空格分隔）</span></label>
                <input type="text" id="favorite" placeholder="例: 3, 17, 8" value="3, 17, 8">
            </div>

            <div id="params-hot" class="mb-4" style="display:none">
                <label for="hot">熱號 <span class="text-slate-500">（用於 8注一區）</span></label>
                <input type="text" id="hot" placeholder="例: 14, 17, 7, 10, 23" value="14, 17, 7, 10, 23, 25, 26, 34, 35, 37, 38">
            </div>

            <div id="params-cold" class="mb-4" style="display:none">
                <label for="cold">冷號 <span class="text-slate-500">（用於 8注一區）</span></label>
                <input type="text" id="cold" placeholder="例: 2, 4, 6, 13, 18" value="2, 4, 6, 13, 18, 21, 24">
            </div>

            <div id="params-first" class="mb-4" style="display:none">
                <label for="selectedFirst">指定第一區號碼 <span class="text-slate-500">（21注需7個、8注二區需6個，不足自動補）</span></label>
                <input type="text" id="selectedFirst" placeholder="例: 3, 7, 17, 23, 28, 32, 37" value="3, 7, 17, 23, 28, 32, 37">
            </div>

            <div id="params-second" class="mb-4" style="display:none">
                <label for="selectedSecond">指定第二區號碼 <span class="text-slate-500">（21注需3個，不足自動補）</span></label>
                <input type="text" id="selectedSecond" placeholder="例: 1, 4, 5" value="1, 4, 5">
            </div>

            <!-- 產生按鈕 -->
            <button class="btn-primary w-full mt-2" onclick="doGenerate()">
                🎲 產生號碼
            </button>
        </div>

        <!-- 結果區 -->
        <div id="result-section" style="display:none">
            <!-- 摘要 -->
            <div class="card">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold text-white">產生結果</h2>
                    <span id="result-summary" class="text-sm text-slate-400"></span>
                </div>

                <!-- 文字格式 -->
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="mb-0">文字格式</label>
                        <button class="btn-secondary" onclick="copyText('result-text')">📋 複製</button>
                    </div>
                    <div id="result-text" class="result-box"></div>
                </div>

                <!-- Python 格式 -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="mb-0">Python 格式 <span class="text-slate-500">（可貼入 check_power_lottery.py）</span></label>
                        <button class="btn-secondary" onclick="copyText('result-python')">📋 複製</button>
                    </div>
                    <div id="result-python" class="result-box" style="font-size:0.8rem"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="super_lotto_generate.js"></script>
    <script>
        // 根據策略顯示/隱藏對應參數
        function onStrategyChange() {
            const s = document.getElementById('strategy').value;

            // 預設全隱藏
            document.getElementById('params-favorite').style.display = 'none';
            document.getElementById('params-hot').style.display = 'none';
            document.getElementById('params-cold').style.display = 'none';
            document.getElementById('params-first').style.display = 'none';
            document.getElementById('params-second').style.display = 'none';

            if (s === '56注全包' || s === '28注(必中九獎)') {
                document.getElementById('params-favorite').style.display = 'block';
            } else if (s === '21注(7組碰)') {
                document.getElementById('params-first').style.display = 'block';
                document.getElementById('params-second').style.display = 'block';
            } else if (s === '8注(第二區全包)') {
                document.getElementById('params-first').style.display = 'block';
            } else if (s === '8注(第一區展開)') {
                document.getElementById('params-favorite').style.display = 'block';
                document.getElementById('params-hot').style.display = 'block';
                document.getElementById('params-cold').style.display = 'block';
            }
        }

        // 產生號碼
        function doGenerate() {
            const strategyName = document.getElementById('strategy').value;
            const options = {
                favorite: parseNumbers(document.getElementById('favorite').value),
                hot: parseNumbers(document.getElementById('hot').value),
                cold: parseNumbers(document.getElementById('cold').value),
                selectedFirst: parseNumbers(document.getElementById('selectedFirst').value),
                selectedSecond: parseNumbers(document.getElementById('selectedSecond').value),
            };

            try {
                const result = generateTickets(strategyName, options);

                document.getElementById('result-summary').textContent =
                    `${strategyName} · ${result.nBets} 注 · ${result.cost.toLocaleString()} 元`;
                document.getElementById('result-text').textContent = result.textFormat;
                document.getElementById('result-python').textContent = result.pythonFormat;
                document.getElementById('result-section').style.display = 'block';

                // 滾動到結果
                document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert('錯誤: ' + e.message);
            }
        }

        // 複製文字
        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const orig = btn.textContent;
                btn.textContent = '✅ 已複製';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = orig;
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        // 初始化：顯示對應參數
        onStrategyChange();
    </script>
</body>
</html>
