<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>威力彩對獎程式</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-300">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 導航 -->
        <div class="flex items-center gap-4 mb-8">
            <a href="index.html" class="nav-link text-sm">← 首頁</a>
            <span class="text-slate-600">|</span>
            <a href="super_lotto_generate.html" class="nav-link text-sm">號碼產生器</a>
        </div>

        <!-- 標題 -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-white mb-1">🏆 威力彩對獎程式</h1>
            <p class="text-slate-400 text-sm">輸入開獎號碼與投注號碼，自動展開分組、逐注對獎</p>
        </div>

        <!-- 開獎號碼 -->
        <div class="card">
            <h2 class="text-lg font-bold text-white mb-4">開獎號碼</h2>
            <div class="grid-2">
                <div>
                    <label for="winFirst">第一區（6 個號碼，逗號或空格分隔）</label>
                    <input type="text" id="winFirst" placeholder="例: 6, 18, 21, 32, 33, 37" value="">
                </div>
                <div>
                    <label for="winSecond">第二區（1 個號碼）</label>
                    <input type="number" id="winSecond" min="1" max="8" placeholder="例: 1" value="">
                </div>
            </div>
            <div class="grid-2 mt-4">
                <div>
                    <label for="jackpot1">頭獎累積獎金 <span class="text-slate-500">（0 = 未知）</span></label>
                    <input type="number" id="jackpot1" value="0" min="0">
                </div>
                <div>
                    <label for="jackpot2">貳獎累積獎金 <span class="text-slate-500">（0 = 未知）</span></label>
                    <input type="number" id="jackpot2" value="0" min="0">
                </div>
            </div>
        </div>

        <!-- 投注號碼 -->
        <div class="card">
            <h2 class="text-lg font-bold text-white mb-4">投注號碼</h2>

            <!-- 輸入方式切換 -->
            <div class="flex gap-2 mb-4">
                <button id="tab-text" class="btn-secondary" onclick="switchTab('text')" style="background:rgba(59,130,246,0.3); border-color:#3b82f6">
                    📝 貼上文字格式
                </button>
                <button id="tab-manual" class="btn-secondary" onclick="switchTab('manual')">
                    ✏️ 手動輸入
                </button>
            </div>

            <!-- 文字格式輸入 -->
            <div id="input-text">
                <label for="ticketText">
                    貼上產生器輸出的文字格式
                    <span class="text-slate-500">（自動解析 [...] 括號）</span>
                </label>
                <textarea id="ticketText" rows="14" placeholder="第一區組合 1: [3, 7, 17, 23, 28, 32]
  搭配第二區號碼: [1, 4, 5, 7]

第一區組合 2: [5, 21, 25, 30, 36, 38]
  搭配第二區號碼: [1, 4, 5, 7]

..."></textarea>
            </div>

            <!-- 手動輸入 -->
            <div id="input-manual" style="display:none">
                <div id="manual-groups">
                    <div class="manual-group mb-3 p-3 rounded-lg" style="background:rgba(15,23,42,0.4)">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-slate-400 text-sm font-medium">組合 1</span>
                        </div>
                        <div class="grid-2">
                            <div>
                                <label>第一區（6 個號碼）</label>
                                <input type="text" class="manual-first" placeholder="例: 3, 7, 17, 23, 28, 32">
                            </div>
                            <div>
                                <label>第二區號碼</label>
                                <input type="text" class="manual-second" placeholder="例: 1, 4, 5, 7">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="btn-secondary mt-2" onclick="addManualGroup()">+ 新增一組</button>
            </div>

            <!-- 對獎按鈕 -->
            <button class="btn-primary w-full mt-4" onclick="doCheck()">
                🏆 開始對獎
            </button>
        </div>

        <!-- 結果區 -->
        <div id="result-section" style="display:none">
            <div class="card">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-bold text-white">對獎結果</h2>
                    <span id="result-summary" class="text-sm text-slate-400"></span>
                </div>
                <div id="result-content"></div>
            </div>
        </div>
    </div>

    <script src="super_lotto_check.js"></script>
    <script>
        let currentTab = 'text';
        let manualGroupCount = 1;

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('input-text').style.display = tab === 'text' ? 'block' : 'none';
            document.getElementById('input-manual').style.display = tab === 'manual' ? 'block' : 'none';

            // 切換按鈕樣式
            document.getElementById('tab-text').style.background = tab === 'text' ? 'rgba(59,130,246,0.3)' : '';
            document.getElementById('tab-text').style.borderColor = tab === 'text' ? '#3b82f6' : '';
            document.getElementById('tab-manual').style.background = tab === 'manual' ? 'rgba(59,130,246,0.3)' : '';
            document.getElementById('tab-manual').style.borderColor = tab === 'manual' ? '#3b82f6' : '';
        }

        function addManualGroup() {
            manualGroupCount++;
            const container = document.getElementById('manual-groups');
            const div = document.createElement('div');
            div.className = 'manual-group mb-3 p-3 rounded-lg';
            div.style.background = 'rgba(15,23,42,0.4)';
            div.innerHTML = `
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-slate-400 text-sm font-medium">組合 ${manualGroupCount}</span>
                    <button class="text-red-400 text-xs hover:text-red-300" onclick="this.closest('.manual-group').remove()">✕ 移除</button>
                </div>
                <div class="grid-2">
                    <div>
                        <label>第一區（6 個號碼）</label>
                        <input type="text" class="manual-first" placeholder="例: 3, 7, 17, 23, 28, 32">
                    </div>
                    <div>
                        <label>第二區號碼</label>
                        <input type="text" class="manual-second" placeholder="例: 1, 4, 5, 7">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function getTicketGroups() {
            if (currentTab === 'text') {
                const text = document.getElementById('ticketText').value;
                if (!text.trim()) throw new Error('請輸入投注號碼');
                return parseTicketText(text);
            } else {
                const firsts = document.querySelectorAll('.manual-first');
                const seconds = document.querySelectorAll('.manual-second');
                const groups = [];
                for (let i = 0; i < firsts.length; i++) {
                    const f = parseNumbers(firsts[i].value);
                    const s = parseNumbers(seconds[i].value);
                    if (f.length > 0 && s.length > 0) {
                        groups.push({ first: f, second: s });
                    }
                }
                if (groups.length === 0) throw new Error('請至少輸入一組投注號碼');
                return groups;
            }
        }

        function doCheck() {
            try {
                // 解析開獎號碼
                const winFirst = parseNumbers(document.getElementById('winFirst').value);
                const winSecond = parseInt(document.getElementById('winSecond').value, 10);
                if (winFirst.length !== 6) throw new Error('第一區需要 6 個號碼');
                if (isNaN(winSecond) || winSecond < 1 || winSecond > 8) throw new Error('第二區需要 1~8 的號碼');

                const jackpot1 = parseInt(document.getElementById('jackpot1').value, 10) || 0;
                const jackpot2 = parseInt(document.getElementById('jackpot2').value, 10) || 0;

                // 解析投注號碼
                const groups = getTicketGroups();
                const tickets = expandTicketGroups(groups);

                // 對獎
                const result = checkPowerLottery(winFirst, winSecond, tickets, jackpot1, jackpot2);

                // 顯示結果
                document.getElementById('result-summary').textContent =
                    `${result.nBets} 注 · 中 ${result.winCount} 注`;
                document.getElementById('result-content').innerHTML =
                    formatCheckResultHTML(winFirst, winSecond, result);
                document.getElementById('result-section').style.display = 'block';
                document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert('錯誤: ' + e.message);
            }
        }
    </script>
</body>
</html>
